<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第2種電気工事士 筆記試験対策</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1e429f;
    --success: #057a55;
    --danger: #c81e1e;
    --warning: #ff5a1f;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a56db 0%, #1e429f 100%);
    color: white;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header .sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .badge {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 24px 16px; }

  /* HOME SCREEN */
  .home-title {
    text-align: center;
    margin-bottom: 32px;
  }
  .home-title h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .home-title p { color: var(--muted); font-size: 14px; }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .category-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .category-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26,86,219,0.15); }
  .category-card .icon { font-size: 32px; margin-bottom: 8px; }
  .category-card .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .category-card .count { font-size: 13px; color: var(--muted); }
  .category-card.all { background: linear-gradient(135deg, #1a56db, #7e3af2); color: white; }
  .category-card.all .count { color: rgba(255,255,255,0.8); }
  .category-card.exam { background: linear-gradient(135deg, #c81e1e, #9b1c1c); color: white; }
  .category-card.exam .count { color: rgba(255,255,255,0.8); }

  /* TIMER */
  .timer-display {
    display: none;
    background: #1f2937;
    color: white;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .timer-display.warning { background: #ff5a1f; }
  .timer-display.danger { background: var(--danger); animation: timerPulse 1s infinite; }
  @keyframes timerPulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

  /* EXAM VERDICT */
  .exam-verdict {
    display: none;
    font-size: 28px;
    font-weight: 800;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .exam-verdict.pass { background: #f0fdf4; color: var(--success); border: 3px solid #a7f3d0; }
  .exam-verdict.fail { background: #fff5f5; color: var(--danger); border: 3px solid #fca5a5; }
  .start-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .start-btn:hover { background: var(--primary-dark); }

  /* PROGRESS */
  .progress-bar-wrap {
    background: var(--border);
    border-radius: 99px;
    height: 8px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #7e3af2);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* QUIZ CARD */
  .quiz-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }
  .question-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .q-num {
    background: var(--primary);
    color: white;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 700;
  }
  .q-category {
    background: #eff6ff;
    color: var(--primary);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .question-text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .question-note {
    font-size: 13px;
    color: var(--muted);
    background: #f9fafb;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 16px;
    border-left: 3px solid var(--border);
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: #f9fafb;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
    line-height: 1.5;
    transition: all 0.15s;
    width: 100%;
    color: var(--text);
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
  .choice-btn .letter {
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .choice-btn.correct { border-color: var(--success); background: #f0fdf4; }
  .choice-btn.correct .letter { background: var(--success); color: white; }
  .choice-btn.wrong { border-color: var(--danger); background: #fff5f5; }
  .choice-btn.wrong .letter { background: var(--danger); color: white; }
  .choice-btn.dimmed { opacity: 0.4; }
  .choice-btn:disabled { cursor: default; }

  /* ANSWER STEP */
  .answer-banner {
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 600;
  }
  .answer-banner.correct-banner { background: #f0fdf4; border: 2px solid #a7f3d0; color: var(--success); }
  .answer-banner.wrong-banner { background: #fff5f5; border: 2px solid #fca5a5; color: var(--danger); }
  .answer-banner .big-icon { font-size: 24px; }

  /* EXPLANATION */
  .explanation-box {
    background: #fefce8;
    border: 2px solid #fde68a;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .explanation-box h4 { font-size: 14px; font-weight: 700; color: #92400e; margin-bottom: 8px; }
  .explanation-box p { font-size: 14px; line-height: 1.7; color: #451a03; }
  .explanation-box .formula {
    background: white;
    border: 1px solid #fde68a;
    border-radius: 6px;
    padding: 8px 12px;
    margin: 8px 0;
    font-family: monospace;
    font-size: 14px;
    color: #1e293b;
  }

  /* BUTTONS */
  .btn-row { display: flex; gap: 10px; }
  .btn {
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--primary); color: white; flex: 1; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #f3f4f6; color: var(--text); border: 2px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }

  /* RESULT SCREEN */
  .result-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #7e3af2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    color: white;
    box-shadow: 0 8px 24px rgba(26,86,219,0.3);
  }
  .score-circle .score-num { font-size: 40px; font-weight: 800; line-height: 1; }
  .score-circle .score-label { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  .result-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .result-sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-box {
    background: #f9fafb;
    border-radius: 10px;
    padding: 16px;
  }
  .stat-box .val { font-size: 24px; font-weight: 700; }
  .stat-box .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat-box.green .val { color: var(--success); }
  .stat-box.red .val { color: var(--danger); }

  /* CATEGORY FILTER IN QUIZ */
  .quiz-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .back-btn {
    background: white;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }
  .back-btn:hover { border-color: var(--primary); color: var(--primary); }
  .quiz-title-info { flex: 1; }
  .quiz-title-info h3 { font-size: 16px; font-weight: 700; }
  .quiz-title-info p { font-size: 12px; color: var(--muted); }

  /* HINT TOGGLE */
  .hint-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: 12px;
    user-select: none;
  }
  .step-indicator {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .step-dot {
    height: 4px;
    flex: 1;
    border-radius: 99px;
    background: var(--border);
    transition: background 0.3s;
  }
  .step-dot.active { background: var(--primary); }
  .step-dot.done { background: var(--success); }

  /* HIDE/SHOW */
  .screen { display: none; }
  .screen.active { display: block; }

  /* REVIEW SECTION */
  .review-list { display: flex; flex-direction: column; gap: 12px; }
  .review-item {
    background: white;
    border-radius: 10px;
    padding: 16px;
    border-left: 4px solid var(--border);
  }
  .review-item.wrong-item { border-color: var(--danger); }
  .review-item.correct-item { border-color: var(--success); }
  .review-item .r-q { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .review-item .r-ans { font-size: 13px; color: var(--muted); }
  .review-item .r-ans span { font-weight: 600; }
  .review-item .r-ans .c { color: var(--success); }
  .review-item .r-ans .w { color: var(--danger); }

  .citation {
    font-size: 11px;
    color: #9ca3af;
    text-align: center;
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="sub">筆記試験対策</div>
    <h1>⚡ 第2種電気工事士</h1>
  </div>
  <div class="badge" id="headerBadge">問題集</div>
</div>

<!-- HOME SCREEN -->
<div class="screen active" id="homeScreen">
  <div class="container">
    <div class="home-title">
      <h2>カテゴリを選択</h2>
      <p>過去問傾向に基づいた問題集で合格を目指そう</p>
    </div>
    <div class="category-grid" id="categoryGrid"></div>
    <p class="citation">過去の試験問題を参考に作成 ／ 出典：電気技術者試験センター公開の過去問題<br>著作権：一般財団法人 電気技術者試験センター All Rights Reserved.</p>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div class="screen" id="quizScreen">
  <div class="container">
    <div class="quiz-header">
      <button class="back-btn" onclick="goHome()">← ホーム</button>
      <div class="quiz-title-info">
        <h3 id="quizCategoryLabel">全問題</h3>
        <p id="quizSubLabel">ランダム順</p>
      </div>
      <div class="timer-display" id="timerDisplay">120:00</div>
    </div>

    <!-- Progress -->
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-info">
      <span id="progressText">1 / 50</span>
      <span id="scoreText">正解: 0</span>
    </div>

    <!-- Step indicator -->
    <div class="step-indicator">
      <div class="step-dot active" id="step1dot"></div>
      <div class="step-dot" id="step2dot"></div>
      <div class="step-dot" id="step3dot"></div>
    </div>

    <!-- STEP 1: Question -->
    <div id="stepQuestion">
      <div class="quiz-card">
        <div class="question-meta">
          <span class="q-num" id="qNum">Q1</span>
          <span class="q-category" id="qCategory">電気計算</span>
        </div>
        <div class="question-text" id="questionText"></div>
        <div class="question-note" id="questionNote" style="display:none"></div>
        <div class="choices" id="choicesContainer"></div>
      </div>
    </div>

    <!-- STEP 2: Answer reveal -->
    <div id="stepAnswer" style="display:none">
      <div class="quiz-card">
        <div class="question-meta">
          <span class="q-num" id="qNum2"></span>
          <span class="q-category" id="qCategory2"></span>
        </div>
        <div class="question-text" id="questionText2"></div>
        <div class="choices" id="choicesContainer2"></div>
      </div>
      <div class="answer-banner" id="answerBanner">
        <span class="big-icon" id="answerIcon"></span>
        <div>
          <div id="answerResult"></div>
          <div id="answerCorrect" style="font-weight:normal;font-size:13px;margin-top:2px;"></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="showExplanation()">💡 解説を見る</button>
      </div>
    </div>

    <!-- STEP 3: Explanation -->
    <div id="stepExplanation" style="display:none">
      <div class="quiz-card">
        <div class="question-meta">
          <span class="q-num" id="qNum3"></span>
          <span class="q-category" id="qCategory3"></span>
        </div>
        <div class="question-text" id="questionText3"></div>
        <div class="choices" id="choicesContainer3"></div>
      </div>
      <div class="answer-banner" id="answerBanner3">
        <span class="big-icon" id="answerIcon3"></span>
        <div id="answerResult3"></div>
      </div>
      <div class="explanation-box">
        <h4>📖 解説</h4>
        <div id="explanationText"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn">次の問題 →</button>
      </div>
    </div>
  </div>
</div>

<!-- RESULT SCREEN -->
<div class="screen" id="resultScreen">
  <div class="container">
    <div class="result-card">
      <div class="score-circle">
        <div class="score-num" id="resultScore">0</div>
        <div class="score-label">点</div>
      </div>
      <div class="exam-verdict" id="examVerdict"></div>
      <div class="result-title" id="resultTitle">お疲れ様でした！</div>
      <div class="result-sub" id="resultSub"></div>
      <div class="result-stats">
        <div class="stat-box green">
          <div class="val" id="correctCount">0</div>
          <div class="lbl">正解</div>
        </div>
        <div class="stat-box red">
          <div class="val" id="wrongCount">0</div>
          <div class="lbl">不正解</div>
        </div>
        <div class="stat-box">
          <div class="val" id="totalCount">0</div>
          <div class="lbl">問題数</div>
        </div>
      </div>
      <div class="btn-row" style="flex-direction:column; gap:10px;">
        <button class="btn btn-primary" onclick="showReview()">📝 間違えた問題を確認</button>
        <button class="btn btn-secondary" onclick="goHome()">🏠 カテゴリ選択に戻る</button>
      </div>
    </div>

    <div id="reviewSection" style="display:none; margin-top:24px;">
      <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;">間違えた問題</h3>
      <div class="review-list" id="reviewList"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// 問題データベース
// ============================================================
const CATEGORIES = {
  exam:         { name: '模擬試験（50問・2時間）', icon: '📝', color: 'exam' },
  all:          { name: '全問題（ランダム）',       icon: '⚡', color: 'all' },
  calc:         { name: '電気計算',                icon: '🔢', color: '' },
  law:          { name: '法令・規格',              icon: '📜', color: '' },
  wiring:       { name: '配線図',                  icon: '🗺️', color: '' },
  material:     { name: '電気材料・器具',          icon: '🔌', color: '' },
  construction: { name: '施工方法',                icon: '🔧', color: '' },
  measurement:  { name: '工具・測定器',            icon: '📏', color: '' },
};

const QUESTIONS = [
  // ─── 電気計算 ───────────────────────────────────────────
  {
    id: 1, category: 'calc',
    q: '10Ωと15Ωの抵抗を並列に接続したとき、合成抵抗の値 [Ω] は。',
    choices: ['4', '6', '8', '25'],
    answer: 1, // 0-indexed → 6
    explanation: '並列合成抵抗の公式：<div class="formula">1/R = 1/R₁ + 1/R₂ = 1/10 + 1/15 = 3/30 + 2/30 = 5/30</div>よって R = 30/5 = <strong>6 Ω</strong>'
  },
  {
    id: 2, category: 'calc',
    q: '100 V の電源に 5 Ω の抵抗を接続したとき、消費電力 [W] は。',
    choices: ['500', '2000', '100', '20'],
    answer: 1,
    explanation: '<div class="formula">P = V²/R = 100² / 5 = 10000 / 5 = 2000 W</div>または P = VI = 100 × (100/5) = 100 × 20 = 2000 W'
  },
  {
    id: 3, category: 'calc',
    q: '1 kWの電熱器を3時間使用したとき、消費電力量 [Wh] は。',
    choices: ['333', '1000', '3000', '9000'],
    answer: 2,
    explanation: '<div class="formula">電力量 = 電力 × 時間 = 1000 W × 3 h = 3000 Wh</div>'
  },
  {
    id: 4, category: 'calc',
    q: '抵抗 R = 3 Ω、誘導リアクタンス XL = 4 Ω が直列接続されている回路のインピーダンス Z [Ω] は。',
    choices: ['7', '5', '1', '3.5'],
    answer: 1,
    explanation: '<div class="formula">Z = √(R² + XL²) = √(3² + 4²) = √(9 + 16) = √25 = 5 Ω</div>'
  },
  {
    id: 5, category: 'calc',
    q: '力率（cos θ）の定義として、正しいものは。',
    choices: [
      '有効電力 ÷ 皮相電力',
      '無効電力 ÷ 皮相電力',
      '皮相電力 ÷ 有効電力',
      '有効電力 ÷ 無効電力'
    ],
    answer: 0,
    explanation: '<div class="formula">力率 cos θ = P（有効電力）/ S（皮相電力）</div>力率1（100%）のとき全電力が有効に消費される。コンデンサや誘導機では力率が低下する。'
  },
  {
    id: 6, category: 'calc',
    q: '単相 3 線式 100/200 V 回路で、外線間の電圧 [V] は。',
    choices: ['100', '200', '300', '173'],
    answer: 1,
    explanation: '単相3線式は中性線と外線間が 100 V、外線間が <strong>200 V</strong>。3線のうち中性線を含む2線を使えば100V、外線同士だと200Vが取り出せる。'
  },
  {
    id: 7, category: 'calc',
    q: '電線の長さを2倍にすると、電線の抵抗値はどうなるか。',

// ============================================================
// アプリ状態
// ============================================================
let state = {
  currentCategory: 'all',
  questions: [],
  currentIndex: 0,
  score: 0,
  userAnswers: [],
  selectedAnswer: null,
  step: 1,          // 1=question, 2=answer, 3=explanation
  examMode: false,
  timerInterval: null,
  timeLeft: 0
};

// ============================================================
// 初期化
// ============================================================
function init() {
  renderCategoryGrid();
}

function getCategoryCount(cat) {
  if (cat === 'exam') return 50;
  if (cat === 'all') return QUESTIONS.length;
  return QUESTIONS.filter(q => q.category === cat).length;
}

function renderCategoryGrid() {
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const div = document.createElement('div');
    div.className = 'category-card ' + cat.color;
    if (key === 'exam') {
      div.innerHTML = `<div class="icon">${cat.icon}</div>
        <div class="name">${cat.name}</div>
        <div class="count">全カテゴリから 50 問・制限時間 120 分</div>`;
    } else {
      const cnt = getCategoryCount(key);
      div.innerHTML = `<div class="icon">${cat.icon}</div>
        <div class="name">${cat.name}</div>
        <div class="count">${cnt} 問</div>`;
    }
    div.onclick = () => startQuiz(key);
    grid.appendChild(div);
  });
}

// ============================================================
// クイズ開始
// ============================================================
function startQuiz(category) {
  stopTimer();
  state.currentCategory = category;
  state.examMode = (category === 'exam');
  state.currentIndex = 0;
  state.score = 0;
  state.userAnswers = [];

  let pool = (category === 'all' || category === 'exam')
    ? [...QUESTIONS]
    : QUESTIONS.filter(q => q.category === category);

  // シャッフル
  pool = pool.sort(() => Math.random() - 0.5);

  // 模擬試験は 50 問に絞る
  if (state.examMode) pool = pool.slice(0, 50);

  state.questions = pool;

  const cat = CATEGORIES[category];
  document.getElementById('quizCategoryLabel').textContent = cat.name;
  document.getElementById('quizSubLabel').textContent = state.examMode
    ? `${pool.length} 問 ／ 制限時間 120 分`
    : `${pool.length} 問 ／ ランダム順`;
  document.getElementById('headerBadge').textContent = cat.icon + ' ' + cat.name;

  // タイマー表示
  const timerEl = document.getElementById('timerDisplay');
  if (state.examMode) {
    timerEl.style.display = 'block';
    startTimer(120 * 60); // 120 分
  } else {
    timerEl.style.display = 'none';
  }

  showScreen('quizScreen');
  showQuestion();
}

// ============================================================
// タイマー
// ============================================================
function startTimer(seconds) {
  state.timeLeft = seconds;
  updateTimerDisplay();
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) {
      stopTimer();
      // 時間切れ：残り問題を不正解として記録してから結果画面へ
      while (state.currentIndex < state.questions.length) {
        const q = state.questions[state.currentIndex];
        state.userAnswers.push({ q, selected: -1, correct: false });
        state.currentIndex++;
      }
      showResult();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  el.textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (state.timeLeft <= 300) {
    el.className = 'timer-display danger';
  } else if (state.timeLeft <= 900) {
    el.className = 'timer-display warning';
  } else {
    el.className = 'timer-display';
  }
}

// ============================================================
// 問題表示
// ============================================================
function showQuestion() {
  const q = state.questions[state.currentIndex];
  state.step = 1;
  state.selectedAnswer = null;

  // Progress
  const pct = (state.currentIndex / state.questions.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    (state.currentIndex + 1) + ' / ' + state.questions.length;
  document.getElementById('scoreText').textContent = '正解: ' + state.score;

  // Step dots
  updateStepDots(1);

  // Fill question
  fillQuestion('qNum', 'qCategory', 'questionText', 'questionNote', 'choicesContainer', q, null);

  // Show/hide steps
  document.getElementById('stepQuestion').style.display = 'block';
  document.getElementById('stepAnswer').style.display = 'none';
  document.getElementById('stepExplanation').style.display = 'none';
}

function fillQuestion(numId, catId, textId, noteId, choicesId, q, selectedIdx) {
  document.getElementById(numId).textContent = 'Q' + (state.currentIndex + 1);
  document.getElementById(catId).textContent = CATEGORIES[q.category].icon + ' ' + CATEGORIES[q.category].name;
  document.getElementById(textId).textContent = q.q;

  const noteEl = document.getElementById(noteId);
  if (noteEl) {
    if (q.note) { noteEl.textContent = q.note; noteEl.style.display = 'block'; }
    else noteEl.style.display = 'none';
  }

  const letters = ['イ', 'ロ', 'ハ', 'ニ'];
  const container = document.getElementById(choicesId);
  container.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    let letterClass = '';
    let extraClass = '';
    if (selectedIdx !== null) {
      btn.disabled = true;
      if (i === q.answer) { extraClass = 'correct'; letterClass = ''; }
      else if (i === selectedIdx && i !== q.answer) { extraClass = 'wrong'; }
      else { extraClass = 'dimmed'; }
    }
    btn.className = 'choice-btn ' + extraClass;
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${c}</span>`;
    if (selectedIdx === null) {
      btn.onclick = () => selectAnswer(i);
    }
    container.appendChild(btn);
  });
}

function selectAnswer(idx) {
  state.selectedAnswer = idx;
  const q = state.questions[state.currentIndex];
  const correct = idx === q.answer;
  if (correct) state.score++;
  state.userAnswers.push({ q, selected: idx, correct });

  updateStepDots(2);

  // Show answer step
  document.getElementById('stepQuestion').style.display = 'none';
  document.getElementById('stepAnswer').style.display = 'block';

  // Fill answer view
  document.getElementById('qNum2').textContent = 'Q' + (state.currentIndex + 1);
  document.getElementById('qCategory2').textContent = CATEGORIES[q.category].icon + ' ' + CATEGORIES[q.category].name;
  document.getElementById('questionText2').textContent = q.q;
  fillChoicesReview('choicesContainer2', q, idx);

  const banner = document.getElementById('answerBanner');
  const letters = ['イ', 'ロ', 'ハ', 'ニ'];
  if (correct) {
    banner.className = 'answer-banner correct-banner';
    document.getElementById('answerIcon').textContent = '✅';
    document.getElementById('answerResult').textContent = '正解！';
    document.getElementById('answerCorrect').textContent = '';
  } else {
    banner.className = 'answer-banner wrong-banner';
    document.getElementById('answerIcon').textContent = '❌';
    document.getElementById('answerResult').textContent = '不正解';
    document.getElementById('answerCorrect').textContent =
      '正解：' + letters[q.answer] + '「' + q.choices[q.answer] + '」';
  }

  document.getElementById('scoreText').textContent = '正解: ' + state.score;
}

function fillChoicesReview(containerId, q, selectedIdx) {
  const letters = ['イ', 'ロ', 'ハ', 'ニ'];
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.disabled = true;
    let extraClass = '';
    if (i === q.answer) extraClass = 'correct';
    else if (i === selectedIdx) extraClass = 'wrong';
    else extraClass = 'dimmed';
    btn.className = 'choice-btn ' + extraClass;
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${c}</span>`;
    container.appendChild(btn);
  });
}

function showExplanation() {
  const q = state.questions[state.currentIndex];
  updateStepDots(3);

  document.getElementById('stepAnswer').style.display = 'none';
  document.getElementById('stepExplanation').style.display = 'block';

  document.getElementById('qNum3').textContent = 'Q' + (state.currentIndex + 1);
  document.getElementById('qCategory3').textContent = CATEGORIES[q.category].icon + ' ' + CATEGORIES[q.category].name;
  document.getElementById('questionText3').textContent = q.q;
  fillChoicesReview('choicesContainer3', q, state.selectedAnswer);

  const letters = ['イ', 'ロ', 'ハ', 'ニ'];
  const correct = state.selectedAnswer === q.answer;
  const banner3 = document.getElementById('answerBanner3');
  const icon3 = document.getElementById('answerIcon3');
  const result3 = document.getElementById('answerResult3');

  if (correct) {
    banner3.className = 'answer-banner correct-banner';
    icon3.textContent = '✅';
    result3.textContent = '正解！ ' + letters[q.answer] + '「' + q.choices[q.answer] + '」';
  } else {
    banner3.className = 'answer-banner wrong-banner';
    icon3.textContent = '❌';
    result3.innerHTML = '不正解 ／ 正解：' + letters[q.answer] + '「' + q.choices[q.answer] + '」';
  }

  document.getElementById('explanationText').innerHTML = q.explanation;

  const nextBtn = document.getElementById('nextBtn');
  const isLast = state.currentIndex === state.questions.length - 1;
  nextBtn.textContent = isLast ? '結果を見る 🎉' : '次の問題 →';
}

function nextQuestion() {
  state.currentIndex++;
  if (state.currentIndex >= state.questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

// ============================================================
// 結果画面
// ============================================================
function showResult() {
  stopTimer();
  document.getElementById('timerDisplay').style.display = 'none';
  showScreen('resultScreen');
  document.getElementById('reviewSection').style.display = 'none';

  const total = state.questions.length;
  const correct = state.score;
  const wrong = total - correct;
  const pct = Math.round((correct / total) * 100);

  document.getElementById('resultScore').textContent = pct;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('totalCount').textContent = total;

  const verdictEl = document.getElementById('examVerdict');
  if (state.examMode) {
    // 模擬試験：合格基準 60%（30/50問）
    if (pct >= 60) {
      verdictEl.className = 'exam-verdict pass';
      verdictEl.textContent = '✅ 合格！';
    } else {
      verdictEl.className = 'exam-verdict fail';
      verdictEl.textContent = '❌ 不合格';
    }
    verdictEl.style.display = 'block';
  } else {
    verdictEl.style.display = 'none';
  }

  let title, sub;
  if (state.examMode) {
    if (pct >= 60) {
      title = '素晴らしい！合格圏内です 🎉';
      sub = `${total}問中 ${correct}問正解（正解率 ${pct}%）。本番でもこの調子で！`;
    } else {
      title = '惜しい！もう少しです 💪';
      sub = `合格基準は 60%（${Math.ceil(total * 0.6)}問）。あと ${Math.ceil(total * 0.6) - correct} 問正解が必要です。`;
    }
  } else {
    if (pct >= 80) { title = '素晴らしい！合格圏内です 🎉'; sub = '本番でもこの調子で頑張ってください！'; }
    else if (pct >= 60) { title = 'もう少し！惜しいです 💪'; sub = '間違えた問題を復習して合格を目指しましょう。'; }
    else { title = '引き続き学習を続けましょう 📚'; sub = '解説をよく読んで、苦手分野を重点的に学習してください。'; }
  }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = sub;
  document.getElementById('headerBadge').textContent = '結果';
}

function showReview() {
  const section = document.getElementById('reviewSection');
  section.style.display = 'block';
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  const letters = ['イ', 'ロ', 'ハ', 'ニ'];
  const wrongAnswers = state.userAnswers.filter(a => !a.correct);
  if (wrongAnswers.length === 0) {
    list.innerHTML = '<div class="review-item correct-item"><div class="r-q">全問正解です！お見事！</div></div>';
    return;
  }
  wrongAnswers.forEach(a => {
    const div = document.createElement('div');
    div.className = 'review-item wrong-item';
    div.innerHTML = `<div class="r-q">${a.q.q}</div>
      <div class="r-ans">
        あなたの回答：<span class="w">${letters[a.selected]}「${a.q.choices[a.selected]}」</span><br>
        正解：<span class="c">${letters[a.q.answer]}「${a.q.choices[a.q.answer]}」</span>
      </div>`;
    list.appendChild(div);
  });
}

// ============================================================
// ユーティリティ
// ============================================================
function updateStepDots(activeStep) {
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById('step' + i + 'dot');
    if (i < activeStep) dot.className = 'step-dot done';
    else if (i === activeStep) dot.className = 'step-dot active';
    else dot.className = 'step-dot';
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  stopTimer();
  document.getElementById('timerDisplay').style.display = 'none';
  state.examMode = false;
  showScreen('homeScreen');
  document.getElementById('headerBadge').textContent = '問題集';
}

init();
</script>
